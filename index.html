<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CV Nisa - Interactive SPA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <header>
        <nav>
            <div class="logo">🌸 CV</div>
            <ul id="menu">
                <li><a href="#" class="nav-link" data-page="home.html">Home</a></li>
                <li><a href="#" class="nav-link" data-page="about.html">About</a></li>
                <li><a href="#" class="nav-link" data-page="experience.html">Experience</a></li>
                <li><a href="#" class="nav-link" data-page="skill.html">Skills</a></li>
                <li><a href="#" class="nav-link" data-page="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="content-holder">
        <div id="loading" style="display:none; color: #f06292; font-weight: bold; margin: 20px;">
            <i class="fas fa-spinner fa-spin"></i> Memuat...
        </div>
        <div id="ajax-content"></div>
    </main>

    <script>
        $(document).ready(function() {
            function loadPage(url, element) {
                $("#ajax-content").fadeOut(300, function() {
                    $('#loading').show();
                    
                    $("#ajax-content").load(url, function(response, status, xhr) {
                        $('#loading').hide();
                        if (status == "error") {
                            $(this).html("<div class='detail-card'><p>Maaf, halaman tidak ditemukan atau gagal dimuat.</p></div>");
                        }
                        $(this).hide().slideDown(600);
                    });
                });

                $(".nav-link").removeClass("active");
                if (element) {
                    $(element).addClass("active");
                } else {
                    $(`.nav-link[data-page="${url}"]`).addClass("active");
                }
            }

            // Load Home saat pertama dibuka
            loadPage("home.html");

            $(".nav-link").click(function(e) {
                e.preventDefault();
                if($(this).hasClass("active")) return;
                let page = $(this).attr("data-page");
                loadPage(page, this);
            });
        });
    </script>
</body>
</html>
